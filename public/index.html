<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FFD · Fit For Deployment</title><meta name="theme-color" content="#0a0b08"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-32.png"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/styles.css"></head><body>
<div class="login">
  <div class="logo"><img src="/icons/logo.png" alt=""><div><div class="brand" data-brand="short">FFD</div><div class="mut small" data-brand="long">Fit For Deployment</div></div></div>
  <p class="mut" data-brand="tagline">Deployment readiness, confirmed.</p>
  <form id="f" class="card mt" autocomplete="on">
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn pri block mt">Sign in</button>
    <p id="err" class="small hidden"></p>
  </form>
  <div id="demo" class="mt hidden"></div>
  <p class="small mut center mt">Private system · authorized personnel only · all access is logged</p>
</div>
<script src="/js/brand.js"></script><script src="/js/common.js"></script><script src="/js/login.js"></script></body></html>
