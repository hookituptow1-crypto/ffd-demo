# Builds the FFD native iOS shell in ios-app/ and uploads it to App Store Connect (TestFlight).
# Runs only when ios-app/ or this file changes; it never touches the web app or Render (Render builds from the Dockerfile).
name: iOS TestFlight

on:
  push:
    branches: [main]
    paths: ['ios-app/**', '.github/workflows/ios-testflight.yml']
  workflow_dispatch:

concurrency:
  group: ffd-ios-testflight
  cancel-in-progress: true

env:
  BUNDLE_ID: com.millingtontransmission.ffd

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      build_number: ${{ steps.ver.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor and sync iOS project
        working-directory: ios-app
        run: |
          npm ci
          npx cap sync ios

      - name: Build number
        id: ver
        run: echo "build_number=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done
          security find-identity -v -p codesigning "$KC"

      - name: Archive
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build_number }} \
            archive | tail -n 60
          test -d "$RUNNER_TEMP/App.xcarchive"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios-app/ci/ExportOptions.plist -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ffd-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

  upload:
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios-app/ci

      - name: Check the App Store Connect app record exists
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install pyjwt cryptography
          EXISTS=$("$RUNNER_TEMP/venv/bin/python" ios-app/ci/asc_app_exists.py "$BUNDLE_ID")
          if [ "$EXISTS" != "yes" ]; then
            echo "::error::No App Store Connect app record for $BUNDLE_ID yet. Create it in App Store Connect > Apps > + New App, then re-run this job."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ffd-ipa
          path: ipa

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
