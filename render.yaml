# Render Blueprint for the FFD demo. Starter instance (~$7/mo) + 1 GB persistent disk at /app/data.
services:
  - type: web
    name: ffd-demo
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: NODE_ENV
        value: production
      - key: DATA_KEY
        generateValue: true  # Render generates a random secret; never stored in the repo
      # Set privately in the Render dashboard (never in the repo):
      - key: ADMIN_PASSWORD        # demo admin (admin@ffd.demo); applied on boot, reseed and Reset demo
        sync: false
      - key: CONTRACTOR_PASSWORD   # all demo crew logins (<first>@ffd.demo)
        sync: false
      - key: OWNER_ADMIN_PASSWORD  # permanent owner admin (24+ chars); owner login is disabled if missing
        sync: false
      - key: OWNER_USERNAME
        value: owner
    disk:
      name: ffd-data
      mountPath: /app/data
      sizeGB: 1
